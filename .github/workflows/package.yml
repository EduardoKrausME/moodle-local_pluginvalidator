name: Installable Moodle ZIP

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and verify Moodle installable ZIP
        run: |
          git archive --format=zip --prefix=pluginvalidator/ --output=local_pluginvalidator.zip HEAD
          unzip -t local_pluginvalidator.zip
          unzip -Z1 local_pluginvalidator.zip | awk -F/ '{if ($1 != "pluginvalidator") exit 1}'
          unzip -Z1 local_pluginvalidator.zip | grep -qx 'pluginvalidator/version.php'
          unzip -Z1 local_pluginvalidator.zip | grep -qx 'pluginvalidator/vendor/moodle-plugin-validate/src/Validator.php'

      - name: Publish installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: local_pluginvalidator-installable
          path: local_pluginvalidator.zip
          if-no-files-found: error
          retention-days: 30
